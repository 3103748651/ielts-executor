name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install v1.4.0 UI payload
        run: |
          base64 -d build_payloads/index_v140.html.gz.b64 | gzip -d > app/src/main/assets/index.html
      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace
      - name: Collect APK and signing tool
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk IELTS-Executor-v1.4.0-unsigned.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          cp "$BT/apksigner" ./apksigner
          cp "$BT/lib/apksigner.jar" ./apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: IELTS-Executor-Android-v1.4.0-unsigned
          path: |
            IELTS-Executor-v1.4.0-unsigned.apk
            apksigner
            apksigner.jar
