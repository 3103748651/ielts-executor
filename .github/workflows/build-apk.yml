name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace
      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk IELTS-Executor-v1.3.0-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IELTS-Executor-Android-v1.3.0-unsigned
          path: IELTS-Executor-v1.3.0-unsigned.apk
